version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: student_pred_db
    restart: always
    environment:
      POSTGRES_DB: academic_prediction
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: secure_academic_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_admin -d academic_prediction"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      target: backend
    container_name: student_pred_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres_admin:secure_academic_password_2026@postgres:5432/academic_prediction
      JWT_SECRET: super_secure_jwt_secret_key_production_2026
      PORT: 8000
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    container_name: student_pred_frontend
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

volumes:
  pgdata:
